name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@v5

      # The game is client-only, so the SPA shell prerenders to dist/client/index.html.
      - name: Build static site
        run: pnpm --filter @stl/game build:pages
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_HANDOFF_URL: https://lighter-than-air-worker.k.workers.dev

      # Any deep link falls back to the SPA shell.
      - run: cp apps/game/dist/client/index.html apps/game/dist/client/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/game/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
