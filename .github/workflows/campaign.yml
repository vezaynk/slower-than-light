name: Campaign document

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  base-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rewrites packages/campaign/base.xml from the campaign tables. A stale
      # committed file leaves a diff.
      - run: pnpm campaign:xml

      - run: git diff --exit-code -- packages/campaign/base.xml
