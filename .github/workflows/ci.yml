name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo's local cache, kept between runs. A pull request restores master's newest cache (and its own),
      # so a task whose inputs and dependencies are unchanged replays instead of running again.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-

      # The script checks under apps/game/scripts read gitignored .grok files.
      - run: pnpm test:ci

      # Every run saves the whole cache again, so drop entries that have not been written for two weeks.
      - name: Prune the turbo cache
        if: always()
        run: find .turbo/cache -type f -mtime +14 -delete 2>/dev/null || true

  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo's local cache, kept between runs. A pull request restores master's newest cache (and its own),
      # so a task whose inputs and dependencies are unchanged replays instead of running again.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-

      # Rewrites the campaign gap and the stand-in. A stale committed file leaves a diff. A cache hit restores the
      # outputs of unchanged sources over the committed files, so a hand-edited golden still shows as a diff.
      - run: pnpm campaign:xml

      - run: pnpm totallynotftl:dat

      - name: Fail when a golden changed
        run: |
          set -eu
          git diff --exit-code
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

      # Every run saves the whole cache again, so drop entries that have not been written for two weeks.
      - name: Prune the turbo cache
        if: always()
        run: find .turbo/cache -type f -mtime +14 -delete 2>/dev/null || true

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tree is not formatted yet. This checks files the change touches.
      - name: Check formatting of changed files
        env:
          FORMAT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/format-changed.mjs "$FORMAT_BASE"
