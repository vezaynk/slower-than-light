name: iOS build (Capacitor)

# Per the user: a Capacitor iOS build on demand. Run it from the Actions tab ("Run workflow").
# Without signing secrets it builds an unsigned app for the simulator and for devices; both are uploaded as artifacts.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        type: choice
        options: [Release, Debug]
        default: Release

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The game is client-only, so the SPA shell prerenders to dist/client/index.html (as for GitHub Pages).
      - name: Build static web app
        run: pnpm --filter @stl/game build:pages
        env:
          PAGES_BASE: /

      # The native project is generated here rather than committed.
      - name: Add and sync the iOS platform
        working-directory: apps/game
        run: |
          if [ ! -d ios ]; then pnpm exec cap add ios; fi
          pnpm exec cap sync ios

      - name: Lock to landscape
        working-directory: apps/game
        run: |
          plist=ios/App/App/Info.plist
          for key in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$plist" || true
            /usr/libexec/PlistBuddy -c "Add :$key array" "$plist"
            /usr/libexec/PlistBuddy -c "Add :$key:0 string UIInterfaceOrientationLandscapeLeft" "$plist"
            /usr/libexec/PlistBuddy -c "Add :$key:1 string UIInterfaceOrientationLandscapeRight" "$plist"
          done

      - name: Build for the simulator
        working-directory: apps/game/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj -scheme App \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for devices (unsigned)
        working-directory: apps/game/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj -scheme App \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package
        working-directory: apps/game/ios/App
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          (cd "build/sim/Build/Products/${{ inputs.configuration }}-iphonesimulator" && zip -qry "$GITHUB_WORKSPACE/out/LighterThanAir-simulator.app.zip" App.app)
          mkdir -p Payload
          cp -R "build/device/Build/Products/${{ inputs.configuration }}-iphoneos/App.app" Payload/
          zip -qry "$GITHUB_WORKSPACE/out/LighterThanAir-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.configuration }}-${{ github.sha }}
          path: out/
          if-no-files-found: error
