name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: node
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

      # Turborepo does not hash the Node version, and the goldens' zlib bytes depend on it.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ steps.node.outputs.version }}-

      # Strict env mode would strip the dat variables silently, and CI has no ftl.dat to notice.
      - run: pnpm test:env

      # The script checks under apps/game/scripts read gitignored .grok files.
      - run: pnpm test:ci

      - name: Prune the turbo cache
        if: always()
        run: find .turbo/cache -type f -mtime +14 -delete 2>/dev/null || true

  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: node
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

      # Turborepo does not hash the Node version, and the goldens' zlib bytes depend on it.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ steps.node.outputs.version }}-

      # A cache hit merges its outputs over the tree and leaves extra files, so clear the trees the generators
      # rebuild. The stand-in generator reads the committed totallynotftl.dat, so that file stays.
      - run: rm -rf packages/campaign/mod packages/totallynotftl/archive

      - run: pnpm campaign:xml

      - run: pnpm totallynotftl:dat

      - name: Fail when a golden changed
        run: |
          set -eu
          git diff --exit-code
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Prune the turbo cache
        if: always()
        run: find .turbo/cache -type f -mtime +14 -delete 2>/dev/null || true

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tree is not formatted yet. This checks files the change touches.
      - name: Check formatting of changed files
        env:
          FORMAT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/format-changed.mjs "$FORMAT_BASE"
